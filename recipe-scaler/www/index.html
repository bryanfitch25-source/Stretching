<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FBF3E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#201B16" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Yield — Recipe Scaler</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>
<div id="app" data-active-pane="list">

  <!-- LIST PANE -->
  <section id="pane-list" class="pane" aria-label="Recipes">
    <header class="pane-header">
      <h1 class="brand">Yield</h1>
      <button id="btn-shopping-mode" class="icon-btn" aria-label="Select recipes for a shopping list">🛒</button>
    </header>
    <div class="search-bar">
      <label for="search-input" class="visually-hidden">Search recipes</label>
      <input id="search-input" type="search" placeholder="Search recipes…" autocomplete="off">
    </div>
    <div id="recipe-list" class="recipe-list" role="list"></div>
    <div id="shopping-bar" class="shopping-bar hidden">
      <span id="shopping-count">0 selected</span>
      <button id="btn-cancel-shopping-mode" class="btn-ghost">Cancel</button>
      <button id="btn-build-shopping-list" class="btn-primary" disabled>Make list</button>
    </div>
    <button id="btn-add-recipe" class="fab" aria-label="Add new recipe">+</button>
  </section>

  <!-- DETAIL / EDIT / SHOPPING PANE -->
  <section id="pane-detail" class="pane pane-secondary" aria-label="Recipe details">
    <div id="detail-root" class="detail-empty">
      <p>Select a recipe to view it here.</p>
    </div>
  </section>

</div>

<script src="js/storage.js"></script>
<script src="js/units.js"></script>
<script src="js/panscale.js"></script>
<script src="js/shopping.js"></script>
<script src="js/app.js"></script>
</body>
</html>
